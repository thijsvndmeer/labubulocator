# fly.toml file for labubulocator
# For more information, see https://fly.io/docs/reference/configuration/

app = 'labubulocator'
primary_region = 'ams'

# Tell Fly to use our monorepo-compatible Dockerfile
[build]
  dockerfile = 'Dockerfile'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
