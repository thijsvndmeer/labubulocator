<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Labubu hero banner</title>
  <desc id="desc">Abstract gradient background for the Labubu collection hero section.</desc>
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="glow" cx="75%" cy="25%" r="60%">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FBBF24" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#gradient)"/>
  <circle cx="1200" cy="200" r="480" fill="url(#glow)"/>
  <ellipse cx="400" cy="700" rx="520" ry="260" fill="#0F172A" fill-opacity="0.3"/>
  <ellipse cx="1250" cy="650" rx="420" ry="240" fill="#0B0F1A" fill-opacity="0.25"/>
</svg>
